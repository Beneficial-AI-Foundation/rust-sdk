# Native-code axiom lock (human decision 2026-11-22; formal/README.md, "Trusted base").
#
# Native-code axioms are those whose name has a `_native` component (declared by
# `decide +native` and `native_decide` as `<decl>._native.decide.ax_<n>`) or Lean.trustCompiler.
# They trust the Lean compiler and native code, not only the kernel, so they are a trust item
# of their own, classified separately from the axioms of formal/trusted/axioms.lock, as in the
# SPQR project (scripts/AuditHeadline.lean, `isNativeAxiom`).
#
# The pinned Aeneas `toStr (s : String) (h : s.toByteArray.size ≤ U32.max := by decide +native)`
# (Aeneas/Std/String.lean) declares one for every string literal of the translation. Only these
# may be listed here: `scripts/lean-guard.sh axioms` rejects any native-code axiom whose
# statement is not exactly `decide ("<literal>".toByteArray.size ≤ Aeneas.Std.U32.max) = true`
# (no universe parameters), even if it is listed.
#
# One line per used native-code axiom: `<full name> <declaring module> sha256:<hex>`, where
# <hex> is the sha256 of the canonical statement printed by scripts/lean-axiom-audit.lean (the
# same structural hashing as axioms.lock). Audit scope as in axioms.lock (the human decision
# of 2026-11-23 set it for axioms.lock; the lead applied the same rule to this lock): a
# native-code axiom is used if it is reachable from some constant declared in a module of the
# Defs, Proofs or Specs library (every constant, including private helpers, instances and
# auxiliary declarations), transitively through any constant. The toStr-form and module
# restrictions above hold for every native-code axiom reached from any project constant (the
# audit's one order-independent walk over all project constants, through types, values and
# whole inductive blocks), used or not; "reached" below means reached by that walk.
# `scripts/lean-guard.sh axioms` fails on a used native-code axiom that is not listed, on a
# changed statement or module of a reached one, and on a stale entry (its module is in the
# audited import closure but the axiom is not reached there, i.e. no longer declared). A line
# for a reached but unused axiom is reported as "unused (allowed)"; reached unused axioms
# without a line are listed for information. Entries for Rmcp.Types/Rmcp.Funs that the
# default-target roots do not reach are reported as not checked; entries naming any other
# module fail. Consequence: the statement of a reached native-code axiom that has no
# line here and is not used can change without CI failing (it must still have the toStr form
# and an Rmcp.Types/Rmcp.Funs module); the translation diff shows it.
#
# These axioms state true facts that the kernel can also check: `simp only [U32.max,
# U32.numBits, UScalarTy.numBits]; decide` proves each with [propext] only (U32.max is
# @[irreducible], which is why plain `decide` fails). An upstream Aeneas `toStr` that
# discharges the side condition that way, and a rev bump, would remove them (open item,
# the S04a evidence (git history at 223ff12)).
#
# Updating: regenerate the translation, run `lake build` with Rmcp in the audited roots and
# `scripts/lean-guard.sh axioms`; the failure message prints the line to add for each
# used unlisted axiom. Reviewers check that each line belongs to a string literal of the generated
# code (the literal is printed by the audit) and that the translation diff explains the change.
#
# Translation of commit f8fb6a7 with the S04a part 2 Charon settings (derived Debug impls
# excluded): the five string literals of the target code.
